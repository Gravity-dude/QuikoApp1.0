name: Build Quiko APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create folders
        run: |
          mkdir -p app/src/main/java/com/quiko/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p gradle/wrapper

      - name: Build config files
        run: |
          printf '%s\n' \
            'distributionBase=GRADLE_USER_HOME' \
            'distributionPath=wrapper/dists' \
            'distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip' \
            'zipStoreBase=GRADLE_USER_HOME' \
            'zipStorePath=wrapper/dists' \
            > gradle/wrapper/gradle-wrapper.properties

          printf '%s\n' \
            "plugins { id 'com.android.application' }" \
            'android {' \
            "  namespace 'com.quiko.app'" \
            '  compileSdk 34' \
            '  defaultConfig {' \
            '    applicationId "com.quiko.app"' \
            '    minSdk 24' \
            '    targetSdk 34' \
            '    versionCode 2' \
            '    versionName "2.0"' \
            '  }' \
            '  buildTypes { release { minifyEnabled false } }' \
            '  compileOptions {' \
            '    sourceCompatibility JavaVersion.VERSION_1_8' \
            '    targetCompatibility JavaVersion.VERSION_1_8' \
            '  }' \
            '}' \
            'dependencies {' \
            "  implementation 'androidx.appcompat:appcompat:1.6.1'" \
            "  implementation 'com.google.android.material:material:1.11.0'" \
            "  implementation 'androidx.constraintlayout:constraintlayout:2.1.4'" \
            "  implementation 'androidx.recyclerview:recyclerview:1.3.2'" \
            "  implementation 'androidx.cardview:cardview:1.0.0'" \
            "  implementation 'androidx.core:core:1.12.0'" \
            '}' \
            > app/build.gradle

          printf '%s\n' \
            'buildscript {' \
            '  repositories { google(); mavenCentral() }' \
            "  dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }" \
            '}' \
            'allprojects { repositories { google(); mavenCentral() } }' \
            > build.gradle

          printf '%s\n' \
            'rootProject.name = "QuikoApp"' \
            "include ':app'" \
            > settings.gradle

          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: AndroidManifest.xml
        run: |
          python3 -c "
          open('app/src/main/AndroidManifest.xml','w').write('''<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">
              <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.FLASHLIGHT\" />
              <uses-permission android:name=\"android.permission.VIBRATE\" />
              <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\" />
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />
              <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />
              <uses-permission android:name=\"android.permission.WAKE_LOCK\" />
              <uses-feature android:name=\"android.hardware.camera.flash\" android:required=\"false\" />
              <uses-feature android:name=\"android.hardware.microphone\" android:required=\"true\" />
              <application
                  android:allowBackup=\"true\"
                  android:icon=\"@drawable/ic_quiko\"
                  android:label=\"@string/app_name\"
                  android:roundIcon=\"@drawable/ic_quiko\"
                  android:supportsRtl=\"true\"
                  android:theme=\"@style/Theme.QuikoApp\">
                  <activity
                      android:name=\".MainActivity\"
                      android:exported=\"true\"
                      android:launchMode=\"singleTop\"
                      android:screenOrientation=\"portrait\">
                      <intent-filter>
                          <action android:name=\"android.intent.action.MAIN\" />
                          <category android:name=\"android.intent.category.LAUNCHER\" />
                      </intent-filter>
                  </activity>
                  <service android:name=\".VoiceListenerService\"
                      android:enabled=\"true\"
                      android:exported=\"false\" />
                  <receiver android:name=\".AlarmReceiver\" android:enabled=\"true\" android:exported=\"false\">
                      <intent-filter><action android:name=\"com.quiko.app.ALARM_TRIGGER\" /></intent-filter>
                  </receiver>
                  <receiver android:name=\".ReminderReceiver\" android:enabled=\"true\" android:exported=\"false\">
                      <intent-filter><action android:name=\"com.quiko.app.REMINDER_TRIGGER\" /></intent-filter>
                  </receiver>
                  <receiver android:name=\".BootReceiver\" android:enabled=\"true\" android:exported=\"false\">
                      <intent-filter android:priority=\"1000\">
                          <action android:name=\"android.intent.action.BOOT_COMPLETED\" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>''')
          "

      - name: Simple data classes
        run: |
          python3 -c "
          import os
          base = 'app/src/main/java/com/quiko/app/'

          open(base+'Reminder.java','w').write('''package com.quiko.app;
          public class Reminder {
              public long id; public String task; public long triggerTimeMs; public boolean done;
              public Reminder(long id,String task,long t,boolean done){this.id=id;this.task=task;this.triggerTimeMs=t;this.done=done;}
          }''')

          open(base+'SoundHelper.java','w').write('''package com.quiko.app;
          import android.content.Context;
          import android.media.AudioManager;
          import android.media.ToneGenerator;
          public class SoundHelper {
              public static void beep(Context ctx){
                  try{new ToneGenerator(AudioManager.STREAM_NOTIFICATION,90).startTone(ToneGenerator.TONE_PROP_BEEP2,200);}
                  catch(Exception e){}
              }
          }''')

          open(base+'BootReceiver.java','w').write('''package com.quiko.app;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import androidx.core.content.ContextCompat;
          public class BootReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context ctx,Intent i){
                  if(Intent.ACTION_BOOT_COMPLETED.equals(i.getAction())){
                      Intent s=new Intent(ctx,VoiceListenerService.class);s.setAction(\"START\");
                      ContextCompat.startForegroundService(ctx,s);
                  }
              }
          }''')
          "

      - name: DatabaseHelper.java
        run: |
          python3 -c "
          open('app/src/main/java/com/quiko/app/DatabaseHelper.java','w').write('''package com.quiko.app;
          import android.content.ContentValues;import android.content.Context;
          import android.database.Cursor;import android.database.sqlite.*;
          import java.util.*;
          public class DatabaseHelper extends SQLiteOpenHelper {
              public DatabaseHelper(Context c){super(c,\"quiko.db\",null,1);}
              @Override public void onCreate(SQLiteDatabase db){
                  db.execSQL(\"CREATE TABLE reminders(id INTEGER PRIMARY KEY AUTOINCREMENT,task TEXT,trigger_time INTEGER,done INTEGER DEFAULT 0)\");
              }
              @Override public void onUpgrade(SQLiteDatabase db,int a,int b){db.execSQL(\"DROP TABLE IF EXISTS reminders\");onCreate(db);}
              public long insert(Reminder r){ContentValues v=new ContentValues();v.put(\"task\",r.task);v.put(\"trigger_time\",r.triggerTimeMs);v.put(\"done\",0);return getWritableDatabase().insert(\"reminders\",null,v);}
              public List<Reminder> getAll(){List<Reminder> l=new ArrayList<>();Cursor c=getReadableDatabase().query(\"reminders\",null,null,null,null,null,\"trigger_time ASC\");if(c.moveToFirst())do{l.add(new Reminder(c.getLong(0),c.getString(1),c.getLong(2),c.getInt(3)==1));}while(c.moveToNext());c.close();return l;}
              public void markDone(long id){ContentValues v=new ContentValues();v.put(\"done\",1);getWritableDatabase().update(\"reminders\",v,\"id=?\",new String[]{\"\" +id});}
              public void delete(long id){getWritableDatabase().delete(\"reminders\",\"id=?\",new String[]{\"\"+id});}
              public void deleteAll(){getWritableDatabase().delete(\"reminders\",null,null);}
          }''')
          "

      - name: AlarmReceiver.java and ReminderReceiver.java
        run: |
          python3 -c "
          base='app/src/main/java/com/quiko/app/'
          open(base+'AlarmReceiver.java','w').write('''package com.quiko.app;
          import android.app.*;import android.content.*;import android.media.*;import android.net.Uri;import android.os.*;import androidx.core.app.NotificationCompat;
          public class AlarmReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context ctx,Intent intent){
                  String label=intent.getStringExtra(\"label\");if(label==null)label=\"Alarm\";
                  String time=intent.getStringExtra(\"time\");if(time==null)time=\"Now\";
                  NotificationManager nm=(NotificationManager)ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                  if(Build.VERSION.SDK_INT>=26&&nm!=null)nm.createNotificationChannel(new NotificationChannel(\"qa\",\"Quiko Alarms\",NotificationManager.IMPORTANCE_HIGH));
                  int f=Build.VERSION.SDK_INT>=23?PendingIntent.FLAG_IMMUTABLE:0;
                  PendingIntent pi=PendingIntent.getActivity(ctx,0,new Intent(ctx,MainActivity.class),f);
                  if(nm!=null)nm.notify(2001,new NotificationCompat.Builder(ctx,\"qa\").setSmallIcon(android.R.drawable.ic_lock_idle_alarm).setContentTitle(\"Alarm: \"+label).setContentText(\"Time: \"+time).setPriority(NotificationCompat.PRIORITY_MAX).setAutoCancel(true).setContentIntent(pi).setVibrate(new long[]{0,500,200,500}).build());
                  try{Ringtone r=RingtoneManager.getRingtone(ctx,RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM));if(r!=null)r.play();}catch(Exception e){}
              }
          }''')
          open(base+'ReminderReceiver.java','w').write('''package com.quiko.app;
          import android.app.*;import android.content.*;import android.media.*;import android.net.Uri;import android.os.*;import androidx.core.app.NotificationCompat;
          public class ReminderReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context ctx,Intent intent){
                  String task=intent.getStringExtra(\"task\");if(task==null)task=\"Reminder\";
                  int rid=intent.getIntExtra(\"id\",-1);
                  if(rid!=-1)new DatabaseHelper(ctx).markDone(rid);
                  NotificationManager nm=(NotificationManager)ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                  if(Build.VERSION.SDK_INT>=26&&nm!=null)nm.createNotificationChannel(new NotificationChannel(\"qr\",\"Quiko Reminders\",NotificationManager.IMPORTANCE_HIGH));
                  int f=Build.VERSION.SDK_INT>=23?PendingIntent.FLAG_IMMUTABLE:0;
                  PendingIntent pi=PendingIntent.getActivity(ctx,rid,new Intent(ctx,MainActivity.class),f);
                  if(nm!=null)nm.notify(3000+rid,new NotificationCompat.Builder(ctx,\"qr\").setSmallIcon(android.R.drawable.ic_popup_reminder).setContentTitle(\"Reminder\").setContentText(task).setPriority(NotificationCompat.PRIORITY_HIGH).setAutoCancel(true).setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)).setContentIntent(pi).build());
              }
          }''')
          "

      - name: ReminderAdapter.java
        run: |
          python3 -c "
          open('app/src/main/java/com/quiko/app/ReminderAdapter.java','w').write('''package com.quiko.app;
          import android.graphics.Paint;import android.view.*;import android.widget.*;
          import androidx.annotation.NonNull;import androidx.recyclerview.widget.RecyclerView;
          import java.text.SimpleDateFormat;import java.util.*;
          public class ReminderAdapter extends RecyclerView.Adapter<ReminderAdapter.VH> {
              interface OnDelete{void run(Reminder r);}
              private List<Reminder> items;private final OnDelete dl;
              private final SimpleDateFormat sdf=new SimpleDateFormat(\"MMM d, h:mm a\",Locale.US);
              public ReminderAdapter(List<Reminder> i,OnDelete d){items=i;dl=d;}
              public void update(List<Reminder> n){items=n;notifyDataSetChanged();}
              @NonNull @Override public VH onCreateViewHolder(@NonNull ViewGroup p,int t){return new VH(LayoutInflater.from(p.getContext()).inflate(R.layout.item_reminder,p,false));}
              @Override public void onBindViewHolder(@NonNull VH h,int i){
                  Reminder r=items.get(i);h.task.setText(r.task);h.time.setText(sdf.format(new Date(r.triggerTimeMs)));
                  h.task.setPaintFlags(r.done?h.task.getPaintFlags()|Paint.STRIKE_THRU_TEXT_FLAG:h.task.getPaintFlags()&~Paint.STRIKE_THRU_TEXT_FLAG);
                  h.task.setAlpha(r.done?0.4f:1f);h.del.setOnClickListener(v->dl.run(r));
              }
              @Override public int getItemCount(){return items.size();}
              static class VH extends RecyclerView.ViewHolder{TextView task,time;ImageButton del;
                  VH(@NonNull View v){super(v);task=v.findViewById(R.id.tvTask);time=v.findViewById(R.id.tvTime);del=v.findViewById(R.id.btnDelete);}
              }
          }''')
          "

      - name: CommandProcessor.java
        run: |
          python3 << 'PYEOF'
          code = r'''package com.quiko.app;
          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.hardware.camera2.CameraAccessException;
          import android.hardware.camera2.CameraCharacteristics;
          import android.hardware.camera2.CameraManager;
          import android.os.Build;
          import android.speech.tts.TextToSpeech;
          import android.util.Log;
          import java.util.Calendar;
          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class CommandProcessor {
              private final Context ctx;
              private final AlarmManager am;
              private final DatabaseHelper db;
              private TextToSpeech tts;
              private String camId;
              private static final Map<String,Integer> NUMS = new HashMap<>();
              static {
                  String[] o={"zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"};
                  String[] t={"","","twenty","thirty","forty","fifty"};
                  for(int i=0;i<o.length;i++) NUMS.put(o[i],i);
                  for(int i=2;i<t.length;i++) NUMS.put(t[i],i*10);
              }

              public CommandProcessor(Context context) {
                  ctx = context.getApplicationContext();
                  am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                  db = new DatabaseHelper(ctx);
                  tts = new TextToSpeech(ctx, st -> { if(st==TextToSpeech.SUCCESS) tts.setLanguage(Locale.US); });
                  try {
                      CameraManager cm=(CameraManager)ctx.getSystemService(Context.CAMERA_SERVICE);
                      for(String id:cm.getCameraIdList())
                          if(Boolean.TRUE.equals(cm.getCameraCharacteristics(id).get(CameraCharacteristics.FLASH_INFO_AVAILABLE))){camId=id;break;}
                  } catch(Exception e){ Log.e("QCP","cam",e); }
              }

              public String handle(String raw) {
                  // Strip wake word variants
                  String cmd = raw.toLowerCase(Locale.US)
                      .replaceAll("hey\\s*qu[ie][ck]+[oa]?","").replaceAll("^\\s*quiko\\s*","").trim();
                  if(cmd.isEmpty()) return "Listening...";
                  Log.d("QCP","cmd="+cmd);

                  if(cmd.contains("cancel alarm")||cmd.contains("stop alarm")) return doCancel();
                  if(cmd.contains("alarm")||cmd.contains("wake me")) return doAlarm(cmd);
                  if(cmd.contains("flash")||cmd.contains("torch")||cmd.contains("light")) return doTorch(!cmd.contains("off")&&!cmd.contains("turn off"));
                  if(cmd.contains("remind")||cmd.contains("reminder")) return doReminder(cmd);
                  if(cmd.contains("time")) return doTime();
                  if(cmd.contains("help")||cmd.contains("what can")) return doHelp();
                  return "Say: alarm at 7 AM, flashlight on, remind me, or what time is it";
              }

              private String doAlarm(String cmd) {
                  Calendar c = parseTime(cmd);
                  if(c==null){ speak("I could not understand the time. Say something like: alarm at 7 AM or alarm in 30 minutes."); return "Could not parse time"; }
                  if(c.getTimeInMillis()<=System.currentTimeMillis()) c.add(Calendar.DAY_OF_YEAR,1);
                  Intent i=new Intent(ctx,AlarmReceiver.class);
                  i.setAction("com.quiko.app.ALARM_TRIGGER");
                  i.putExtra("label","Quiko Alarm");i.putExtra("time",fmt(c));
                  int f=Build.VERSION.SDK_INT>=23?PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE:PendingIntent.FLAG_UPDATE_CURRENT;
                  am.set(AlarmManager.RTC_WAKEUP,c.getTimeInMillis(),PendingIntent.getBroadcast(ctx,(int)c.getTimeInMillis(),i,f));
                  String t=fmt(c); speak("Alarm set for "+t); return "Alarm set for "+t;
              }

              private String doCancel() {
                  int f=Build.VERSION.SDK_INT>=23?PendingIntent.FLAG_NO_CREATE|PendingIntent.FLAG_IMMUTABLE:PendingIntent.FLAG_NO_CREATE;
                  PendingIntent pi=PendingIntent.getBroadcast(ctx,0,new Intent(ctx,AlarmReceiver.class),f);
                  if(pi!=null){am.cancel(pi);pi.cancel();speak("Alarm cancelled");return "Alarm cancelled";}
                  speak("No alarm to cancel"); return "No alarm found";
              }

              private String doTorch(boolean on) {
                  if(camId==null) return "No flash found";
                  try{
                      ((CameraManager)ctx.getSystemService(Context.CAMERA_SERVICE)).setTorchMode(camId,on);
                      String m=on?"Flashlight on":"Flashlight off"; speak(m); return m;
                  }catch(CameraAccessException e){return "Flash error";}
              }

              private String doReminder(String cmd) {
                  String task=cmd.replaceAll("(?i)remind me to?","").replaceAll("(?i)set a? ?reminder","").trim();
                  Calendar c=parseTime(cmd); long at; String td;
                  if(c!=null){
                      if(c.getTimeInMillis()<=System.currentTimeMillis()) c.add(Calendar.DAY_OF_YEAR,1);
                      at=c.getTimeInMillis();td=fmt(c);
                      task=task.replaceAll("(?i)\\s*(at|in)\\s+\\d.*","").trim();
                  } else {
                      c=Calendar.getInstance();c.add(Calendar.HOUR_OF_DAY,1);
                      at=c.getTimeInMillis();td=fmt(c)+" (1h)";
                  }
                  if(task.isEmpty())task="Reminder";
                  long id=db.insert(new Reminder(0,task,at,false));
                  Intent ri=new Intent(ctx,ReminderReceiver.class);
                  ri.setAction("com.quiko.app.REMINDER_TRIGGER");ri.putExtra("task",task);ri.putExtra("id",(int)id);
                  int f=Build.VERSION.SDK_INT>=23?PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE:PendingIntent.FLAG_UPDATE_CURRENT;
                  am.set(AlarmManager.RTC_WAKEUP,at,PendingIntent.getBroadcast(ctx,(int)id,ri,f));
                  speak("Reminder set: "+task+" at "+td); return "Reminder: "+task+" @ "+td;
              }

              private String doTime() {
                  Calendar n=Calendar.getInstance();
                  String t=String.format(Locale.US,"%d:%02d %s",n.get(Calendar.HOUR)==0?12:n.get(Calendar.HOUR),n.get(Calendar.MINUTE),n.get(Calendar.AM_PM)==Calendar.AM?"AM":"PM");
                  speak("It is "+t); return "Time: "+t;
              }

              private String doHelp() {
                  speak("Say Hey Quiko followed by your command. For example: Hey Quiko set alarm at 7 AM. Or Hey Quiko flashlight on.");
                  return "Commands: alarm at 7AM | alarm in 30min | flashlight on/off | remind me [task] at [time] | what time is it | cancel alarm";
              }

              public Calendar parseTime(String text) {
                  text=text.toLowerCase(Locale.US);
                  // "in X minutes/hours"
                  Matcher m=Pattern.compile("in\\s+(\\w+)\\s+(min(?:utes?)?|hr|hours?)").matcher(text);
                  if(m.find()){int a=num(m.group(1));if(a>0){Calendar c=Calendar.getInstance();if(m.group(2).startsWith("h"))c.add(Calendar.HOUR_OF_DAY,a);else c.add(Calendar.MINUTE,a);c.set(Calendar.SECOND,0);return c;}}
                  // "at 7:30 AM" or "at 7 AM"
                  m=Pattern.compile("(?:at\\s+)?(\\d{1,2})(?:[:\\s](\\d{2}))?\\s*(am|pm)").matcher(text);
                  if(m.find()){int h=Integer.parseInt(m.group(1)),mn=m.group(2)!=null?Integer.parseInt(m.group(2).trim()):0;boolean pm=m.group(3).startsWith("p");if(pm&&h!=12)h+=12;if(!pm&&h==12)h=0;Calendar c=Calendar.getInstance();c.set(Calendar.HOUR_OF_DAY,h);c.set(Calendar.MINUTE,mn);c.set(Calendar.SECOND,0);c.set(Calendar.MILLISECOND,0);return c;}
                  // "at 14:30"
                  m=Pattern.compile("at\\s+(\\d{1,2}):(\\d{2})").matcher(text);
                  if(m.find()){int h=Integer.parseInt(m.group(1)),mn=Integer.parseInt(m.group(2));if(h<=23&&mn<=59){Calendar c=Calendar.getInstance();c.set(Calendar.HOUR_OF_DAY,h);c.set(Calendar.MINUTE,mn);c.set(Calendar.SECOND,0);c.set(Calendar.MILLISECOND,0);return c;}}
                  return null;
              }

              private int num(String w){try{return Integer.parseInt(w);}catch(Exception e){Integer v=NUMS.get(w);return v!=null?v:-1;}}
              private String fmt(Calendar c){int h=c.get(Calendar.HOUR);if(h==0)h=12;return String.format(Locale.US,"%d:%02d %s",h,c.get(Calendar.MINUTE),c.get(Calendar.AM_PM)==Calendar.AM?"AM":"PM");}
              public void speak(String t){if(tts!=null)tts.speak(t,TextToSpeech.QUEUE_FLUSH,null,"q");}
          }'''
          open('app/src/main/java/com/quiko/app/CommandProcessor.java','w').write(code)
          PYEOF

      # THE CORE FIX: Completely rewritten voice engine
      # - Handles ALL SpeechRecognizer error codes properly
      # - One-sentence mode: "Hey Quiko set alarm at 7 AM" works
      # - Two-sentence mode: say "Hey Quiko" then wait for beep then speak
      # - Exponential backoff on repeated errors (fixes the 2-second loop)
      # - Works on Android 7 through Android 15
      - name: VoiceListenerService.java
        run: |
          python3 << 'PYEOF'
          code = r'''package com.quiko.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.util.Log;
          import androidx.core.app.NotificationCompat;
          import java.util.ArrayList;
          import java.util.Locale;

          public class VoiceListenerService extends Service {

              private static final String TAG = "Quiko";
              private static final String CH = "quiko_svc";
              private static final int NID = 1;

              // All the ways Android STT might hear "Hey Quiko"
              private static final String[] TRIGGERS = {
                  "hey quiko","hey quicko","hey quick","hey keeko","hey kiko",
                  "quiko","quicko","a quiko","hey quicker","hey peeko",
                  "hey wiko","hey wiki","hey wick o","equip o","a quick"
              };

              // Recognizer error codes
              private static final int ERR_NO_MATCH        = 7;
              private static final int ERR_SPEECH_TIMEOUT  = 6;
              private static final int ERR_RECOGNIZER_BUSY = 8;
              private static final int ERR_CLIENT          = 5;

              private SpeechRecognizer sr;
              private final Handler H = new Handler(Looper.getMainLooper());
              private CommandProcessor cp;
              private boolean active = false;
              private boolean waitingForCommand = false;

              // Backoff: if errors keep happening, slow down restarts
              private int errorCount = 0;
              private static final int MAX_BACKOFF_MS = 4000;

              public interface CB { void update(String s, String cmd); }
              private static CB callback;
              public static void setCB(CB c){ callback = c; }

              // ── Lifecycle ───────────────────────────────────────────────
              @Override public void onCreate(){
                  super.onCreate();
                  cp = new CommandProcessor(this);
                  makeChannel();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId){
                  if(intent!=null && "STOP".equals(intent.getAction())){
                      halt(); stopForeground(true); stopSelf(); return START_NOT_STICKY;
                  }
                  startForeground(NID, notif("Listening for Hey Quiko..."));
                  active = true;
                  errorCount = 0;
                  H.postDelayed(this::listen, 600);
                  return START_STICKY;
              }

              @Override public IBinder onBind(Intent i){ return null; }
              @Override public void onDestroy(){ halt(); super.onDestroy(); }

              // ── Core listen loop ────────────────────────────────────────
              private void listen(){
                  if(!active) return;
                  destroySR();
                  if(!SpeechRecognizer.isRecognitionAvailable(this)){
                      ui("Speech recognition not available on this device", null);
                      return;
                  }
                  sr = SpeechRecognizer.createSpeechRecognizer(this);
                  sr.setRecognitionListener(new Ears());
                  sr.startListening(makeIntent());
                  Log.d(TAG,"listen() started");
              }

              private Intent makeIntent(){
                  Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "en-US");
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, "en-US");
                  i.putExtra(RecognizerIntent.EXTRA_ONLY_RETURN_LANGUAGE_MODEL_RESULTS, true);
                  i.putExtra(RecognizerIntent.EXTRA_PREFER_OFFLINE, true);
                  i.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 8);
                  i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                  // Long silence tolerance so full sentences get captured
                  i.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_MINIMUM_LENGTH_MILLIS, 1500L);
                  i.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 2000L);
                  i.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS, 1200L);
                  return i;
              }

              private void scheduleRestart(int delayMs){
                  H.removeCallbacksAndMessages(null);
                  H.postDelayed(this::listen, delayMs);
              }

              private void halt(){
                  active = false;
                  H.removeCallbacksAndMessages(null);
                  destroySR();
              }

              private void destroySR(){
                  if(sr!=null){
                      try{ sr.cancel(); }catch(Exception ignored){}
                      try{ sr.destroy(); }catch(Exception ignored){}
                      sr = null;
                  }
              }

              // ── Recognition listener ────────────────────────────────────
              private class Ears implements RecognitionListener {

                  @Override public void onReadyForSpeech(Bundle p){
                      errorCount = 0; // reset backoff on successful start
                      if(waitingForCommand)
                          ui("Listening for command...", null);
                      else
                          ui("Listening for Hey Quiko...", null);
                  }

                  @Override public void onBeginningOfSpeech(){ Log.d(TAG,"speech started"); }
                  @Override public void onRmsChanged(float r){}
                  @Override public void onBufferReceived(byte[] b){}
                  @Override public void onEndOfSpeech(){ Log.d(TAG,"speech ended"); }
                  @Override public void onEvent(int t, Bundle e){}

                  @Override
                  public void onPartialResults(Bundle pb){
                      ArrayList<String> parts = pb.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                      if(parts==null||parts.isEmpty()) return;
                      String partial = parts.get(0).toLowerCase(Locale.US);
                      Log.d(TAG,"partial: "+partial);

                      if(!waitingForCommand){
                          // Check if wake word already came through in partial
                          String cmd = extractCmd(partial);
                          if(cmd!=null && !cmd.isEmpty() &&
                             (cmd.contains("alarm")||cmd.contains("flash")||cmd.contains("torch")||
                              cmd.contains("remind")||cmd.contains("light")||cmd.contains("time"))){
                              // Full command in partials - fire early
                              Log.d(TAG,"early trigger from partial: "+cmd);
                              destroySR();
                              SoundHelper.beep(VoiceListenerService.this);
                              waitingForCommand = false;
                              execute(cmd);
                          }
                      }
                  }

                  @Override
                  public void onResults(Bundle results){
                      if(!active) return;
                      ArrayList<String> all = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                      if(all==null||all.isEmpty()){ restart(); return; }

                      Log.d(TAG,"results: "+all);

                      if(waitingForCommand){
                          // We already heard "Hey Quiko", this is the command
                          waitingForCommand = false;
                          String cmd = all.get(0).toLowerCase(Locale.US);
                          // Strip wake word if it leaked in again
                          String stripped = extractCmd(cmd);
                          execute(stripped!=null&&!stripped.isEmpty() ? stripped : cmd);
                          return;
                      }

                      // Check all alternatives for wake word + optional command
                      for(String alt : all){
                          String lower = alt.toLowerCase(Locale.US);
                          String cmd = extractCmd(lower);
                          if(cmd!=null){
                              SoundHelper.beep(VoiceListenerService.this);
                              if(cmd.isEmpty()){
                                  // Only wake word - wait for command
                                  waitingForCommand = true;
                                  ui("Hey Quiko! Say your command now...", null);
                                  notify2("Say your command now...");
                                  H.postDelayed(()->{ if(active) listen(); }, 500);
                              } else {
                                  // Wake word + command in one go
                                  waitingForCommand = false;
                                  execute(cmd);
                              }
                              return;
                          }
                      }
                      // No wake word found - just restart
                      restart();
                  }

                  @Override
                  public void onError(int error){
                      Log.d(TAG,"error="+error);
                      errorCount++;
                      int delay;
                      switch(error){
                          case ERR_NO_MATCH:       // Normal - no speech matched
                          case ERR_SPEECH_TIMEOUT: // Normal - silence timeout
                              errorCount = Math.max(0, errorCount-1); // don't count these
                              delay = 300;
                              break;
                          case ERR_RECOGNIZER_BUSY: // Recognizer still busy
                              delay = 1500;
                              break;
                          case ERR_CLIENT:          // Client side error - recreate
                              delay = 800;
                              break;
                          default:
                              // Exponential backoff for repeated real errors
                              delay = Math.min(500 * errorCount, MAX_BACKOFF_MS);
                      }
                      if(waitingForCommand){ waitingForCommand=false; }
                      scheduleRestart(delay);
                  }
              }

              // ── Helpers ─────────────────────────────────────────────────

              /** Returns command text if wake word found, null if not found, empty string if only wake word */
              private String extractCmd(String text){
                  for(String t : TRIGGERS){
                      int idx = text.indexOf(t);
                      if(idx>=0){
                          String after = text.substring(idx+t.length()).trim();
                          // Also check before (e.g. "set alarm hey quiko" - unlikely but safe)
                          return after;
                      }
                  }
                  return null;
              }

              private void execute(String cmd){
                  if(cmd==null||cmd.isEmpty()){ restart(); return; }
                  String result = cp.handle(cmd);
                  ui("\""+cmd+"\" → "+result, cmd);
                  notify2("Done: "+cmd);
                  Log.d(TAG,"executed: "+cmd+" → "+result);
                  // Go back to wake word listening
                  H.postDelayed(()->{
                      if(active){
                          notify2("Listening for Hey Quiko...");
                          listen();
                      }
                  }, 2500);
              }

              private void restart(){
                  scheduleRestart(350);
              }

              private void ui(String s, String cmd){
                  if(callback!=null) callback.update(s,cmd);
              }

              // ── Notifications ────────────────────────────────────────────
              private void makeChannel(){
                  if(Build.VERSION.SDK_INT>=26){
                      NotificationChannel c=new NotificationChannel(CH,"Quiko",NotificationManager.IMPORTANCE_LOW);
                      c.setSound(null,null); c.enableVibration(false);
                      NotificationManager nm=getSystemService(NotificationManager.class);
                      if(nm!=null) nm.createNotificationChannel(c);
                  }
              }

              private Notification notif(String text){
                  int f=Build.VERSION.SDK_INT>=23?PendingIntent.FLAG_IMMUTABLE:0;
                  PendingIntent pi=PendingIntent.getActivity(this,0,new Intent(this,MainActivity.class),f);

                  Intent stopI=new Intent(this,VoiceListenerService.class); stopI.setAction("STOP");
                  int sf=Build.VERSION.SDK_INT>=23?PendingIntent.FLAG_IMMUTABLE:0;
                  PendingIntent stopPi=PendingIntent.getService(this,1,stopI,sf);

                  return new NotificationCompat.Builder(this,CH)
                      .setContentTitle("Quiko")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentIntent(pi)
                      .addAction(android.R.drawable.ic_delete,"Stop",stopPi)
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setSound(null)
                      .build();
              }

              private void notify2(String text){
                  NotificationManager nm=(NotificationManager)getSystemService(NOTIFICATION_SERVICE);
                  if(nm!=null) nm.notify(NID, notif(text));
              }
          }'''
