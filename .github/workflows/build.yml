      - name: MainActivity.java
        run: |
          python3 << 'PYEOF'
          code = r'''package com.quiko.app;
          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.recyclerview.widget.LinearLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;
          import com.google.android.material.floatingactionbutton.FloatingActionButton;
          import com.google.android.material.switchmaterial.SwitchMaterial;
          import java.util.List;

          public class MainActivity extends AppCompatActivity {
              private static final int RC = 101;
              private TextView tvStatus, tvLast;
              private SwitchMaterial sw;
              private ReminderAdapter adapter;
              private DatabaseHelper db;

              @Override protected void onCreate(Bundle b){
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  db=new DatabaseHelper(this);
                  tvStatus=findViewById(R.id.tvStatus);
                  tvLast=findViewById(R.id.tvLastCommand);
                  sw=findViewById(R.id.switchListening);
                  RecyclerView rv=findViewById(R.id.rvReminders);
                  rv.setLayoutManager(new LinearLayoutManager(this));
                  sw.setOnCheckedChangeListener((v,on)->{if(on)startQ();else stopQ();});
                  FloatingActionButton fab=findViewById(R.id.fabClear);
                  fab.setOnClickListener(v->{db.deleteAll();loadR();Toast.makeText(this,"Cleared",Toast.LENGTH_SHORT).show();});
                  setUI();
                  loadR();
                  // Auto-start on open
                  if(hasMicPerm()) sw.setChecked(true);
                  else askPerm();
              }

              private void setUI(){
                  VoiceListenerService.setCB((s,cmd)->runOnUiThread(()->{
                      if(s!=null) tvStatus.setText(s);
                      if(cmd!=null){tvLast.setText("Last: "+cmd);loadR();}
                  }));
              }

              private void startQ(){
                  if(!hasMicPerm()){sw.setChecked(false);askPerm();return;}
                  Intent i=new Intent(this,VoiceListenerService.class);i.setAction("START");
                  ContextCompat.startForegroundService(this,i);
                  tvStatus.setText("Listening for Hey Quiko...");
              }

              private void stopQ(){
                  Intent i=new Intent(this,VoiceListenerService.class);i.setAction("STOP");
                  startService(i); tvStatus.setText("Paused");
              }

              private void loadR(){
                  List<Reminder> list=db.getAll();
                  RecyclerView rv=findViewById(R.id.rvReminders);
                  if(adapter==null){adapter=new ReminderAdapter(list,r->{db.delete(r.id);loadR();});rv.setAdapter(adapter);}
                  else adapter.update(list);
              }

              private boolean hasMicPerm(){ return ContextCompat.checkSelfPermission(this,Manifest.permission.RECORD_AUDIO)==PackageManager.PERMISSION_GRANTED; }

              private void askPerm(){
                  String[] p=new String[]{Manifest.permission.RECORD_AUDIO};
                  if(Build.VERSION.SDK_INT>=33) p=new String[]{Manifest.permission.RECORD_AUDIO,Manifest.permission.POST_NOTIFICATIONS};
                  ActivityCompat.requestPermissions(this,p,RC);
              }

              @Override public void onRequestPermissionsResult(int rc,@NonNull String[] p,@NonNull int[] r){
                  super.onRequestPermissionsResult(rc,p,r);
                  if(rc==RC&&r.length>0&&r[0]==PackageManager.PERMISSION_GRANTED) sw.setChecked(true);
                  else Toast.makeText(this,"Microphone permission needed!",Toast.LENGTH_LONG).show();
              }

              @Override protected void onResume(){super.onResume();loadR();setUI();}
              @Override protected void onDestroy(){super.onDestroy();VoiceListenerService.setCB(null);}
          }'''
